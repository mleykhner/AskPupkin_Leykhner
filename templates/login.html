{% extends 'layouts/base.html' %}
{% block content %}
    <div class="row d-flex mb-5 align-items-center">
        <div class="col d-flex gap-3 align-items-center">
            <h2>Log In</h2>
        </div>
    </div>
    <div class="row d-flex mb-5 gap-5 w-75 justify-content-center">
        {% if form.non_field_errors %}
            <div class="row">
                <p class="text-danger">{{ form.non_field_errors }}</p>
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-3">
                    <span class="input-group-text" id="tags-input">Login</span>
                </div>
                <div class="col">
                    {{ form.username }}
                </div>
            </div>
            <div class="row">
                <div class="col-3">
                    <span class="input-group-text" id="tags-input">Password</span>
                </div>
                <div class="col">
                    {{ form.password }}
                </div>
            </div>
            <div class="row">
                <div class="col-3"></div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Log in!</button>
                </div>
            </div>
        </form>

        <div class="row">
            <div class="col-3"></div>
            <div class="col-auto">
                <a href="{% url 'signup' %}" class="">Create new account</a>
            </div>
        </div>
    </div>
{% endblock %}
