services:
  ask-leykhner:
    container_name: ask-leykhner
    build: .
    ports:
      - '8000:8000'
      - '8081:8081'
    volumes:
      - ./uploads:/opt/app/uploads
    env_file:
      - ./env/django.env
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:14
    env_file:
      - ./env/postgres.env

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./static:/opt/app/static:ro
      - ./uploads:/opt/app/uploads:rw
    restart: unless-stopped