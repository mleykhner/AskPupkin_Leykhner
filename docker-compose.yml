services:
  ask-leykhner:
    container_name: ask-leykhner
    build: .
    ports:
      - '8000:8000'
      - '8081:8081'
    volumes:
      - ./uploads:/opt/app/uploads
    env_file:
      - ./env/django.env
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:14
    env_file:
      - ./env/postgres.env
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    volumes:
      - ./env/centrifugo.json:/centrifugo/centrifugo.json
    command: centrifugo -c centrifugo.json
    ports:
      - '9000:9000'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./static:/opt/app/static:ro
      - ./uploads:/opt/app/uploads:rw
    restart: unless-stopped

volumes:
  pgdata:
    driver: local